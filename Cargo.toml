[workspace]
resolver = "2"
members = [
    "src-tauri",
    "crates/lotusair-core",
    "crates/lotusair-bluetooth",
    "crates/lotusair-driver",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Khuc Xuan Trien <khucxtriendev@gmail.com>"]
license = "GPL-3.0"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "2"

# Bluetooth
btleplug = "0.11"

# Crypto
aes = "0.8"
cbc = "0.1"

# Misc
bytes = "1"

# Internal crates
lotusair-core = { path = "crates/lotusair-core" }
lotusair-bluetooth = { path = "crates/lotusair-bluetooth" }
lotusair-driver = { path = "crates/lotusair-driver" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
